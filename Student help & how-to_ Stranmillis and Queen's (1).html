<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Student help &amp; how-to | Stranmillis and Queen’s</title>
<style>
:root{--bg:#f3f5f9;--panel:#fff;--ink:#16202e;--soft:#566274;--line:#dfe4ec;--hover:#f7f9fc;--qub:#1d2e4a;--qubt:#eef1f6;--stran:#0078d4;--stranl:#005a9e;--strant:#e8f3fc;--hero:#005a9e;--focus:#0078d4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151d;--panel:#182130;--ink:#e8edf5;--soft:#9aa8bb;--line:#27334a;--hover:#1c2739;--qub:#a9bde0;--qubt:#1f2b44;--stran:#4aa8f0;--stranl:#6cb9f5;--strant:#12304a;--hero:#0b3a63;--focus:#6cb9f5}}
:root[data-theme="dark"]{--bg:#10151d;--panel:#182130;--ink:#e8edf5;--soft:#9aa8bb;--line:#27334a;--hover:#1c2739;--qub:#a9bde0;--qubt:#1f2b44;--stran:#4aa8f0;--stranl:#6cb9f5;--strant:#12304a;--hero:#0b3a63;--focus:#6cb9f5}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 "Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
.wrap{max-width:860px;margin:0 auto;padding:12px 14px 40px}
.hero{background:var(--hero);color:#fff;border-radius:14px;padding:20px clamp(16px,3.5vw,28px);display:flex;gap:16px;align-items:center}
.crest{flex:none;width:54px;height:54px;border-radius:50%;background:#fff;display:grid;place-items:center}
.crest img{width:37px;height:auto}
h1{font:600 clamp(21px,3vw,28px)/1.2 Georgia,"Iowan Old Style","Times New Roman",serif;margin:0 0 4px;letter-spacing:-.02em}
.hero p{margin:0;font-size:14px;opacity:.92;max-width:54ch}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 0 8px;display:flex;flex-wrap:wrap;gap:10px}
.search{flex:1 1 260px;position:relative}
.search input{width:100%;font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
button{font:inherit;color:inherit;cursor:pointer}
.seg button{border:0;background:none;padding:7px 12px;border-radius:7px;font-weight:600;font-size:13.5px;color:var(--soft)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:thin}
.chips button{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--soft)}
.chips button[aria-pressed=true]{border-color:var(--ink);color:var(--ink);font-weight:600}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--soft);margin:2px 2px 6px}
.meta button{background:none;border:0;color:var(--stranl);font-weight:600;font-size:13px;padding:4px}
.cat{margin-top:26px}
h2{font:600 17px/1.3 Georgia,"Times New Roman",serif;margin:0 0 8px;padding-bottom:7px;border-bottom:1px solid var(--line)}
.grp{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
details{border-bottom:1px solid var(--line)}
details:last-child{border-bottom:0}
summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px 16px;font-weight:600;font-size:14.5px;-webkit-tap-highlight-color:transparent}
summary::-webkit-details-marker{display:none}
summary:hover,details[open]>summary{background:var(--hover)}
summary:focus-visible,button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.q{flex:1;min-width:0}
.pls{display:flex;gap:5px;flex:none}
.pl{font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:4px}
.pl.qub{background:var(--qubt);color:var(--qub)}
.pl.stran{background:var(--strant);color:var(--stranl)}
.chev{flex:none;width:18px;height:18px;color:var(--soft);transition:transform .2s}
details[open] .chev{transform:rotate(180deg)}
.ans{padding:2px 16px 16px}
.lanes{display:grid;gap:12px}
@media(min-width:680px){.lanes.two{grid-template-columns:1fr 1fr}}
.lane{border-left:3px solid;border-radius:8px;padding:10px 14px;color:var(--soft);font-size:14.5px}
.lane.qub{border-color:var(--qub);background:var(--qubt)}
.lane.stran{border-color:var(--stran);background:var(--strant)}
.lane h4{margin:0 0 6px;font-size:13.5px;color:var(--ink)}
.lane p{margin:0 0 9px}.lane>:last-child{margin-bottom:0}
.lane ul,.lane ol{margin:0 0 9px;padding-left:1.2rem}
.lane li{margin-bottom:4px}
.lane b{color:var(--ink)}
.lane a{color:var(--stranl);font-weight:600;text-decoration:none;border-bottom:1px solid currentColor;overflow-wrap:anywhere}
.lane dl{margin:0 0 9px;display:grid;grid-template-columns:auto 1fr;gap:5px 12px}
.lane dt{font-weight:600;color:var(--ink);font-size:13.5px}.lane dd{margin:0}
.empty{text-align:center;color:var(--soft);padding:40px 10px}
.empty button{margin-top:10px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 14px}
footer{margin-top:30px;font-size:12.5px;color:var(--soft)}
footer a{color:var(--stranl)}
@media(max-width:480px){summary{padding:12px;gap:10px}.pls{display:none}.ans{padding:2px 12px 14px}.seg button{padding:7px 9px}}
@media(prefers-reduced-motion:reduce){.chev{transition:none}}
</style>
</head>

stran:`<p>Sign in to Microsoft 365 at ${a('https://portal.office.com','portal.office.com')} with your Stranmillis email address and password.</p>`},
{id:'pw',c:'acc',q:'I’ve forgotten my password',
qub:`<p>Reset or unlock your account with Self-Service Password Reset: ${a(P+'Services/ITServiceDesk/sspr/','SSPR portal')} or ${a('https://go.qub.ac.uk/forgotpassword','go.qub.ac.uk/forgotpassword')}.</p><p>If you can’t finish the reset or Multi-Factor Authentication (MFA), email ${m('itservicedesk@qub.ac.uk')} with your student number and identity details ready, or visit the IT Support Desk in the McClay Library.</p><p><b>Tip:</b> use a private window for the reset.</p>`,
stran:`<p>IT Support can help with Stranmillis password resets. Email ${m('itsupport@stran.ac.uk')}, call ${t('028 9038 4242','+442890384242')}, or call in at First Floor, Central Building.</p>`},
{id:'c2k',c:'acc',q:'I don’t know my C2K username or password',
stran:`<p>Visit the ${a('https://www.c2kschools.net','C2K website')}. Students on placement can use the Self-Rove process to reach placement-school systems.</p><p>For help with your C2K username, password or roving access, contact ${m('itsupport@stran.ac.uk')}.</p>`},
{id:'phone',c:'acc',q:'Can I get my email on my phone?',
qub:`<p>Yes, for QUB email, calendar and contacts use ${a('https://www.microsoft.com/en-us/microsoft-365/outlook-mobile-for-android-and-ios','Outlook for Mobile')} (recommended) or the ${a(P+'Services/queens-online-mobile-app/','Queen’s Online Mobile App')} (Apple and Android).</p>`},
{id:'fwd',c:'acc',q:'Can I forward my QUB email to another account?',
qub:`<p>No. You can’t automatically forward email from your Queen’s account to another account. ${a(P+'Student/StudentComputing/#d.en.1679012','More about your QUB email account')}</p>`},
{id:'itc',c:'it',q:'How do I contact IT Support?',
qub:`<p>Monday to Friday, 09:00–17:00 (subject to University closure days). ${a(P+'StatusofKeyServices/','Status of key services')}</p>`+dl([['Drop-in','Free, no booking. Ground floor concourse, McClay Library; also first floor MBC (BioMed) Library and ground floor RVH/Mulhouse (Medical) Library.'],['Phone',t('028 9097 3760','+442890973760')],['Email',m('itservicedesk@qub.ac.uk')+' (use your QUB address)'],['Online',a('https://it.qub.ac.uk/sitehelpdesk/user/log.asp','Request IT Support')+' to log and track calls'],['School IT',`Ask your ${a(P+'Services/ITServiceDesk/ComputerOfficers/','School Computer Officer')} first if you have one`]]),
stran:dl([['Email',m('itsupport@stran.ac.uk')],['Phone',t('028 9038 4242','+442890384242')],['Location','First Floor, Central Building']])+`<p>Use your Stranmillis or QUB email account where possible. IT Support can help with password resets, email, Microsoft 365, device issues, printing, C2K and general IT queries.</p>`},
{id:'wifi',c:'net',q:'How do I connect to Wi‑Fi?',
qub:`<h4>iOS, Windows and macOS</h4><ol><li>Choose <b>QUB_WiFi</b></li><li>Enter your Queen’s student number and password (accept any certificate prompt)</li><li>Open a browser, go to ${a('https://www.qub.ac.uk','qub.ac.uk')} and complete sign-on</li></ol><h4>Android</h4><ol><li>Open ${a(P+'Services/WiFi/eduroam/eduroamforQUBStaffandStudents/','Eduroam for QUB Staff and Students')} on mobile data or another network</li><li>Follow the link to the configuration tool and download the installer. It sets up both eduroam and QUB_WiFi</li></ol><p>Still stuck? Visit IT Support, ground floor of the McClay Library.</p>`,
stran:`<p>Eduroam and wireless setup guidance, including device configuration, is in the IT Services section of the Student Intranet.</p>`},
{id:'print',c:'net',q:'How do I print and pay for printing?',
qub:`<ul><li>Top up your PaperCut credit: ${a('https://print.qub.ac.uk/user','check and top up print credit')}</li><li>Collect your job from any accessible multifunction device (MFD) on campus, so a queue at the nearest one doesn’t matter</li><li>Library and PFC MFDs print in colour, which costs more than mono. ${a(P+'Services/PrintingCopyingandScanning/#d.en.1486261','Printing costs')}</li></ul><p>${a(P+'Services/PrintingCopyingandScanning/','Printers in Student Computing Areas')}</p>`,
stran:`<p>Manage print jobs at ${a('https://stran.uk.uniflowonline.com','UniFlow Online')}. After signing in with your Stran 365 account:</p><ol><li>Open the Dashboard</li><li>Find PIN under Identities</li><li>Select Show PIN Code</li></ol><p>More on the Student Intranet (uniFlow / Canon Printers). Enquiries: ${m('printlss@stran.ac.uk')}</p>`},
{id:'tt',c:'rec',q:'How do I find my timetable?',
qub:`<p><b>Exam timetable:</b></p><ol><li>Log in to Queen’s Online (QOL)</li><li>Select <b>Services</b>, then <b>Administration</b></li><li>Click <b>Exam Timetable</b></li></ol>`,
stran:`<p><b>Class timetable:</b> open the ${a('https://timetabler.stran.ac.uk','Timetable Portal')} and sign in with your Stranmillis email address and password.</p><p><b>Timetable problems:</b> ${m('timetabling@stran.ac.uk')}, Monday to Friday, 9:00am–5:00pm.</p>`},
{id:'qsis',c:'rec',q:'How do I access QSIS and Queen’s Online?',
qub:`<ul><li>QSIS: ${a('https://qsis.qub.ac.uk','qsis.qub.ac.uk')}. Sign in with your student number and QUB password.</li><li>Queen’s Online (QOL): ${a('https://www.qol.qub.ac.uk','qol.qub.ac.uk')}. Sign in with your QUB email address or username.</li></ul>`},
{id:'grad',c:'rec',q:'How do I register for graduation?',
qub:`<p>Registration, gown hire and ceremonies are on the ${a('https://www.qub.ac.uk/Graduation/','Queen’s Graduation pages')}.</p><p>It’s a two-step process: your intention on QSIS, then Marston Events for gown and tickets. Watch your Queen’s email for eligibility notices.</p>`},
{id:'sca',c:'study',q:'Where are the Student Computing Areas?',
qub:`<p>Computers and space for independent study, in four places:</p><ul><li><b>McClay Library</b>, 10 College Park (beside the Botanic Gardens entrance)</li><li><b>Peter Froggatt Centre</b>, Quadrangle, Main Campus</li><li><b>Medical Biology Centre</b>, Lisburn Road, opposite Elmwood Ave</li><li><b>Medical Library</b>, Mulhouse Building, Royal Victoria Hospital</li></ul><p>Entry needs your ${a(P+'Services/SmartCards/','smart card')} or the Digital ID in the Queen’s mobile app. ${a(P+'Student/StudentComputing/StudySpacesinEachBuilding/','Study spaces in each building')}</p>`},
{id:'hrs',c:'study',q:'When are computing areas open, and how busy is the library?',
qub:`<p>Usual semester hours are on the ${a(P+'Student/getting-started/#d.en.1679073','Getting Started')} page and can change, so check notices in libraries and computing areas.</p><p>${a(P+'TheLibrary/LibraryOpeningHours/','Library opening hours')} for semester and vacation. ${a('https://sentry.qub.ac.uk/occupancy/','Live McClay Library occupancy')}</p>`},
{id:'grp',c:'study',q:'How do I book a group study space?',
qub:`<p>Book through ${a('https://www.qol.qub.ac.uk','Queen’s Online')}. The Group Study Room Booking links are under <b>Administration</b>. ${a(P+'TheLibrary/UsingtheLibrary/StudyingintheLibrary/GroupStudyRooms/','About group study facilities')}</p>`},
{id:'lib',c:'study',q:'How do I access library resources?',
qub:`<p>See ${a(P+'TheLibrary/LibraryOpeningHours/','Library opening hours')} and check live occupancy for the ${a('https://sentry.qub.ac.uk/occupancy/','McClay Library')}.</p>`,
stran:`<p>Go to ${a('https://stran.libguides.com','stran.libguides.com')} or email ${m('library@stran.ac.uk')}.</p>`},
{id:'plc',c:'learn',q:'How do I access placement information?',
stran:`<p>Open the ${a('https://placement.stran.ac.uk','Placement Portal')} with your Stranmillis email address and password. More is on the Student Intranet (School-Based Work).</p>`+dl([['Email',m('placements@stran.ac.uk')],['Phone',t('028 9038 4344','+442890384344')]])},
{id:'canvas',c:'learn',q:'How do I access Canvas, and who helps with problems?',
stran:`<p>Sign in at ${a('https://stran.instructure.com','stran.instructure.com')} with your Stranmillis email address and password. Help guides are on the Student Intranet (Canvas Help).</p><p>For issues, email ${m('canvassupport@stran.ac.uk')} or use Canvas’ built-in 24/7 support.</p>`},
{id:'acad',c:'learn',q:'How do I access academic resources?',
stran:`<p>The Student Intranet’s Academic Resources area covers Student Study Regulations and Assessment, Programme and Placement Information, Teaching: The Reflective Profession, and Academic Programme Information.</p>`},
{id:'sup',c:'help',q:'What student support is available?',
qub:`<p>If you’re registered with Disability Services, see ${a(P+'TheLibrary/UsingtheLibrary/InclusiveLibrarySupport/','Inclusive Library Support')}. Questions or suggestions: ${m('library@qub.ac.uk')}</p>`,
stran:`<p>Student Support Services include Counselling, Careers &amp; Employability, the Communication Skills Centre, and Health &amp; Safety support. Resources are in the Student Support area of the Student Intranet.</p><p><b>Student Support Officer:</b> Patricia Smyth<br>${m('p.smyth@stran.ac.uk')} · ${t('028 9038 4510','+442890384510')}</p>`},
{id:'staff',c:'help',q:'How do I find a member of staff?',
stran:`<p>Use Staff Finder on the Student Intranet. Common contacts:</p>`+dl([['Registry',m('registry@stran.ac.uk')],['Timetabling',m('timetabling@stran.ac.uk')],['Placements',m('placements@stran.ac.uk')],['Library',m('library@stran.ac.uk')],['Student Support',m('studentsupport@stran.ac.uk')],['IT Support',m('itsupport@stran.ac.uk')]])},
{id:'emerg',c:'safe',q:'I’m experiencing an emergency. Who do I contact?',
qub:`<h4>Personal safety</h4><p>The 24-hour Security Team is available seven days a week. <b>If you feel unsafe or see anything suspicious on campus, call the Security Control Room: ${t('028 9097 5099','+442890975099')}.</b> ${a('https://www.qub.ac.uk/directorates/EstatesDirectorate/Services/Security/','Personal Safety Pocket Guide and more')}</p><h4>Medical issues</h4><p>In the McClay Library, ask at the Borrower Services Desk, Reception or another service desk and staff will call a first aider. First aid is also available from Security, 24/7.</p><ul><li><b>101</b>: UK non-emergency, including hate crime</li><li><b>111</b>: NHS non-emergency medical advice</li><li><b>999</b>: Police, Ambulance and Fire, for serious emergencies</li></ul><p>Unsure whether to dial 999? Call Queen’s Security for advice.</p>`},
{id:'files',c:'soft',q:'Where can I save my files?',
qub:`<p>Every student has secure personal storage on <b>OneDrive</b> in Microsoft 365, reachable from any device. ${a(P+'Services/Microsoft365Queens/','Office 365 at Queen’s')}</p><p>On campus you also have personal space on the <b>Q: Drive</b>. Save your work before you log out.</p>`},
{id:'sw',c:'soft',q:'Where can I buy reduced-price software?',
qub:`<p>Queen’s students can buy software and other products at reduced prices. ${a(P+'Student/StudentComputing/#d.en.1679078','See the supplier list')}</p>`},
{id:'cyber',c:'soft',q:'Where can I learn more about cyber security?',
qub:`<p>Guidance on protecting devices, plus policies and guidelines: ${a(P+'Services/Security/','Cyber security at Queen’s')}</p>`}
];
const LN={qub:['QUB','Queen’s (QUB)'],stran:['Stran','Stranmillis']};
const S={sys:'all',cat:'all',q:''},open=new Set();
const $=id=>document.getElementById(id),strip=h=>h.replace(/<[^>]+>/g,' ');
const CH='<svg class="chev" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M5 7.5L10 12.5L15 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function render(){
const words=S.q.toLowerCase().split(/\s+/).filter(Boolean);let n=0,h='';
for(const [ck,cn] of CATS){
if(S.cat!=='all'&&S.cat!==ck)continue;let it='';
for(const e of E.filter(e=>e.c===ck)){
const ls=['qub','stran'].filter(l=>e[l]&&(S.sys==='all'||S.sys===l));
if(!ls.length)continue;
const hay=(e.q+' '+ls.map(l=>strip(e[l])).join(' ')).toLowerCase();
if(!words.every(w=>hay.includes(w)))continue;n++;
it+=`<details id="${e.id}"${open.has(e.id)||words.length?' open':''}><summary><span class="q">${e.q}</span><span class="pls">${ls.map(l=>`<span class="pl ${l}">${LN[l][0]}</span>`).join('')}</span>${CH}</summary><div class="ans"><div class="lanes${ls.length>1?' two':''}">${ls.map(l=>`<section class="lane ${l}"><h4>${LN[l][1]}</h4>${e[l]}</section>`).join('')}</div></div></details>`;}
if(it)h+=`<section class="cat"><h2>${cn}</h2><div class="grp">${it}</div></section>`;}
$('list').innerHTML=h||`<div class="empty">No answers match${S.q?` “${S.q.replace(/[<>&]/g,'')}”`:''}.<br>Try fewer words, or show answers for both institutions.<br><button id="clr">Clear search and filters</button></div>`;
$('n').textContent=n+(n===1?' answer':' answers');
if(!h)$('clr').onclick=()=>{S.q='';S.sys='all';S.cat='all';$('s').value='';sync();render()};}
function sync(){
document.querySelectorAll('#seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===S.sys));
$('chips').innerHTML=[['all','All topics'],...CATS].map(([k,v])=>`<button data-c="${k}" aria-pressed="${k===S.cat}">${v}</button>`).join('');}
$('seg').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.sys=b.dataset.v;sync();render()};
$('chips').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.cat=b.dataset.c;sync();render()};
$('s').oninput=e=>{S.q=e.target.value;render()};
$('list').addEventListener('toggle',ev=>{const d=ev.target;if(d.id)d.open?open.add(d.id):open.delete(d.id)},true);
$('ex').onclick=()=>document.querySelectorAll('#list details').forEach(d=>d.open=true);
$('co').onclick=()=>document.querySelectorAll('#list details').forEach(d=>d.open=false);
sync();render();
</script>
